name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types and builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Lint stability and integration preparation
        run: npm run lint:stability
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Build demonstration
        run: npm run build:demo
  ui:
    name: Responsive UI and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: enterprise-ui-review
          path: .porto-tooling/ui-review
  postgres:
    name: PostgreSQL API and native build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: portaria-ci-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      PORTO_TEST_POSTGRES_CONFIG: '{"host":"127.0.0.1","port":5432,"user":"postgres","password":"portaria-ci-ephemeral","database":"postgres"}'
      PORTO_DB_PROVIDER: postgres
      PORTO_PG_CONFIG: '{"host":"127.0.0.1","port":5432,"user":"postgres","password":"portaria-ci-ephemeral","database":"postgres"}'
      PORTO_MEDIA_ROOT: .porto-ci-media
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --experimental-strip-types --test tests/postgres.test.mjs tests/postgres-stability.test.mjs tests/postgres-transactions.test.mjs tests/integration-preparation.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify private video playback in browser
        run: node --experimental-strip-types --test tests/postgres.test.mjs
        env:
          PORTO_TEST_VIDEO_BROWSER: 'true'
          PORTO_TEST_HTTPS: 'true'
      - name: Verify browser hydration and automatic reload
        run: npm run test:hmr
        env:
          PORTO_E2E_MANAGE_SERVER: 'true'
