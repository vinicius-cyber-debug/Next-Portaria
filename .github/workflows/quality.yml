name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types and builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject known high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Check types
        run: npm run check
      - name: Lint the complete repository
        run: npm run lint
      - name: Check readable source formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Build demonstration
        run: npm run build:demo
  ui:
    name: Responsive UI and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: enterprise-ui-review
          path: .porto-tooling/ui-review
  postgres:
    name: PostgreSQL API, iDSecure and native build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: portaria-ci-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      PORTO_TEST_POSTGRES_CONFIG: '{"host":"127.0.0.1","port":5432,"user":"postgres","password":"portaria-ci-ephemeral","database":"postgres"}'
      PORTO_DB_PROVIDER: postgres
      PORTO_PG_CONFIG: '{"host":"127.0.0.1","port":5432,"user":"postgres","password":"portaria-ci-ephemeral","database":"postgres"}'
      PORTO_MEDIA_ROOT: .porto-ci-media
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run all tests with PostgreSQL, including iDSecure and security regressions
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify Porto approval and entry over HTTPS
        run: npm run test:porto:browser
      - name: Verify access policies in browser
        run: npm run test:access:browser
      - name: Verify isolated turnstile monitor in browser
        run: npm run test:monitor:browser
      - name: Verify visitor photo and initial authorization in browser
        run: npm run test:visitor-face:browser
      - name: Verify individual exit permits and offline recovery over HTTPS
        run: npm run test:exit:browser
      - name: Verify interface freshness, person search and responsive navigation
        run: npm run test:interface:browser
      - name: Verify company fleet, inspection media and material invoice
        run: npm run test:logistics:browser
      - name: Verify Control iD settings against a simulated HTTPS central
        run: npm run test:controlid:browser
      - name: Save PostgreSQL browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: porto-foundation-review
          path: |
            .porto-tooling/porto-review
            .porto-tooling/access-review
            .porto-tooling/turnstile-review
            .porto-tooling/visitor-face-review
            .porto-tooling/exit-review
            .porto-tooling/interface-review
            .porto-tooling/logistics-browser
            .porto-tooling/controlid-browser
      - name: Verify private video playback in browser
        run: node --experimental-strip-types --test tests/postgres.test.mjs
        env:
          PORTO_TEST_VIDEO_BROWSER: 'true'
          PORTO_TEST_HTTPS: 'true'
      - name: Verify browser hydration and automatic reload
        run: npm run test:hmr
        env:
          PORTO_E2E_MANAGE_SERVER: 'true'
